        - name: entity_type
          in: query
          schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,49}$" }
        - name: entity_id
          in: query
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          description: Inclusive start date in the YYYY-MM-DD format.
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: Inclusive end date in the YYYY-MM-DD format.
          schema: { type: string, format: date }
      responses:
        "200":
          $ref: "#/components/responses/PaginatedSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UUID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    Success:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Success"
    PaginatedSuccess:
      description: Paginated operation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaginatedSuccess"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: object
          properties:
            status: { type: string, enum: [ok] }
    Success:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginatedSuccess:
      type: object
      required: [success, message, data, meta]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: array
          items: {}
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginationMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    Error:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        error:
          type: object
          required: [code, details]
          properties:
            code: { type: string }
            details:
              type: array
              items: {}
